name: markdown-ai-mcp
description: 'Markdown Ai MCP server. Tools: convert to html, generate toc, lint markdown.
  Built by MEOK AI Labs.'
version: 1.0.0
tools:
- name: convert_to_html
  description: Convert Markdown to HTML (supports headers, bold, italic, links, code,
    lists).
  parameters:
  - name: markdown
    type: string
    required: true
- name: generate_toc
  description: Generate a table of contents from Markdown headers.
  parameters:
  - name: markdown
    type: string
    required: true
  - name: max_depth
    type: integer
    required: false
- name: lint_markdown
  description: Lint Markdown for common issues.
  parameters:
  - name: markdown
    type: string
    required: true
- name: format_table
  description: 'Format data as a Markdown table. headers: comma-separated. rows: semicolon-separated
    rows of comma-separated values. alignment: L/C/R per column.'
  parameters:
  - name: headers
    type: string
    required: true
  - name: rows
    type: string
    required: true
  - name: alignment
    type: string
    required: false
startCommand:
  type: stdio
  configSchema:
    type: object
    required:
    - apiKey
    properties:
      apiKey:
        type: string
        description: Your MEOK API Key
  commandFunction: "(config) => ({\n  command: 'uvx',\n  args: ['markdown-ai-mcp',\
    \ '--api-key', config.apiKey],\n  env: {\n    MEOK_API_KEY: config.apiKey\n  }\n\
    })"
